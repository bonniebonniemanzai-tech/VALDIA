<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101722"><title>VALDIA v0.3</title><style>
:root{color-scheme:dark;--bg:#0d131c;--panel:#192332;--line:#35465b;--gold:#e7bd69;--text:#eaf0f7;--muted:#a9b7c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}header{padding:18px 16px;background:#111b29;border-bottom:1px solid var(--line)}h1{margin:0;color:var(--gold);letter-spacing:.12em;font-size:25px}h2{font-size:19px;color:var(--gold);margin:0 0 12px}h3{margin:8px 0}small,.muted{color:var(--muted)}main{max-width:850px;margin:auto;padding:15px 14px 110px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#101a28;padding:12px;border-radius:9px}.stat strong{display:block;color:var(--gold);font-size:20px;overflow-wrap:anywhere}button,input,select,textarea{font:inherit}button{background:#31445d;color:white;border:1px solid #526783;border-radius:8px;padding:10px 13px;cursor:pointer}button.primary{background:#886324;border-color:#b58b44}button.danger{background:#64363c}button:disabled{opacity:.5}input,select,textarea{width:100%;background:#0e1825;color:white;border:1px solid #4b6079;border-radius:8px;padding:10px;margin:5px 0 11px}textarea{min-height:80px}label{display:block;font-size:13px;color:#c8d4e2}nav{position:fixed;bottom:0;left:0;right:0;background:#101a28;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:3;padding-bottom:env(safe-area-inset-bottom)}nav button{min-width:80px;flex:1;border:0;border-radius:0;background:transparent;font-size:12px;padding:12px 6px}nav button.active{color:var(--gold);border-top:3px solid var(--gold)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.item{padding:11px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.item:last-child{border:0}.item strong{color:#f1d393}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{font-size:12px;padding:7px 10px}.hidden{display:none}.notice{padding:10px;background:#28344a;border-radius:8px;margin-bottom:10px}.success{color:#a9e5b5}.warn{color:#f4c38d}code{white-space:pre-wrap;overflow-wrap:anywhere}#toast{position:fixed;top:12px;right:12px;background:#284536;padding:10px;border-radius:8px;z-index:9;display:none}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>VALDIA <small>v0.3</small></h1><div class="muted">国家運営・戦争TRPG 統合台帳</div></header><main id="app"></main><nav id="nav"></nav><div id="toast" role="status"></div><input type="file" id="file" accept=".json,application/json" class="hidden"><script>
'use strict';const KEY='valdia-v01-save';const kinds={nations:'国家',units:'軍団',characters:'人物',research:'研究',buildings:'建築',events:'履歴'};const schemas={nations:[['name','国家名','text'],['population','人口','number'],['troops','兵力','number'],['treasury','国庫','number'],['income','日次収益','number'],['notes','備考','text']],units:[['name','部隊名','text'],['nation','所属国家','text'],['troops','兵数','number'],['morale','士気(0〜100)','number'],['notes','兵科・配置・備考','text']],characters:[['name','人物名','text'],['nation','所属','text'],['hp','HP','number'],['maxHp','最大HP','number'],['mp','MP','number'],['maxMp','最大MP','number'],['ap','AP','number'],['notes','技能・装備・備考','text']],research:[['name','研究名','text'],['progress','進捗','number'],['target','必要RP','number'],['daily','日次進捗','number'],['notes','備考','text']],buildings:[['name','建築物名','text'],['nation','所属国家','text'],['cost','建築費','number'],['income','日次収益','number'],['daysLeft','残工期(日)','number'],['notes','備考','text']]};function fresh(){return{version:1,world:'新規キャンペーン',season:'春',year:1,day:1,hour:8,minute:0,turn:1,playerNation:'',lastDailyKey:'',nations:[],units:[],characters:[],research:[],buildings:[],events:[]}}let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh();if(!state||state.version!==1)throw Error('version');for(const k of Object.keys(kinds))if(!Array.isArray(state[k]))state[k]=[];if(!Number.isInteger(state.year)||state.year<1)state.year=1}catch(e){state=fresh()}let tab='home',edit=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number.isFinite(Number(v))?Number(v):0;const uid=()=>crypto?.randomUUID?.()||String(Date.now())+Math.random();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('保存に失敗しました。JSON書き出しでバックアップしてください。');return false}}function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}function log(t){state.events.unshift({id:uid(),at:dateText(),text:t});if(state.events.length>3000)state.events.length=3000}function dateText(){return`第${state.year||1}年 ${esc(state.season)}${state.day}日 ${String(state.hour).padStart(2,'0')}:${String(state.minute).padStart(2,'0')}`}function render(){const tabs=[['home','概要'],['nations','国家'],['units','軍団'],['characters','人物'],['research','研究'],['buildings','建築'],['events','履歴'],['tools','道具']];$('nav').innerHTML=tabs.map(([id,n])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;edit=null;render()});$('app').innerHTML=tab==='home'?home():tab==='tools'?tools():tab==='events'?events():collection(tab);wire()}function home(){let treasury=state.nations.reduce((a,n)=>a+num(n.treasury),0),troops=state.units.reduce((a,u)=>a+num(u.troops),0);return`<section class="panel"><h2>${esc(state.world)}</h2><div class="muted">第${state.turn}幕 ・ ${dateText()}</div><div class="stats"><div class="stat">国家数<strong>${state.nations.length}</strong></div><div class="stat">登録軍団兵力<strong>${troops.toLocaleString()}</strong></div><div class="stat">国庫合計<strong>${treasury.toLocaleString()}</strong></div><div class="stat">進行研究<strong>${state.research.filter(x=>num(x.progress)<num(x.target)).length}</strong></div></div></section><section class="panel"><h2>時間進行</h2><div class="row"><button data-advance="1">+1時間</button><button data-advance="6">+6時間</button><button data-advance="24">+1日</button></div><p class="muted">06:00を通過すると、各国家の登録日次収益と研究進捗を自動計上します。建築の残工期も1日減算します。日次処理は重複しません。</p><button id="nextturn">次の幕へ</button></section><section class="panel"><h2>開始設定</h2><label>キャンペーン名<input id="world" value="${esc(state.world)}"></label><label>プレイヤー国家<select id="player"><option value="">未指定</option>${state.nations.map(n=>`<option value="${esc(n.id)}" ${state.playerNation===n.id?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label><div class="row"><label>季節<select id="season">${['春','夏','秋','冬'].map(s=>`<option ${state.season===s?'selected':''}>${s}</option>`).join('')}</select></label><label>日(1〜50)<input id="day" type="number" min="1" max="50" value="${state.day}"></label></div><div class="row"><label>時<input id="hour" type="number" min="0" max="23" value="${state.hour}"></label><label>分<input id="minute" type="number" min="0" max="59" value="${state.minute}"></label></div><button id="settings" class="primary">設定を保存</button><p class="warn">日時を手動変更しても過去の日次処理は自動再計算されません。</p></section><section class="panel"><h2>保存状態</h2><p>端末内に自動保存します。ただしブラウザデータ消去などで失われる可能性があります。必ず定期的にJSONバックアップを保存してください。</p><button id="exportHome" class="primary">セーブを書き出す</button></section>`}function collection(k){let fields=schemas[k],items=state[k];let current=edit&&edit.kind===k?items.find(x=>x.id===edit.id):null;return`<section class="panel"><h2>${kinds[k]}台帳 (${items.length})</h2><div class="notice">${k==='nations'?'国家の国庫と日次収益を登録します。':k==='buildings'?'建築物の日次収益は国家収益に含めず、完成後に所属国家へ別途加算します。':'登録・修正・削除は即時保存されます。'}</div>${items.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><div class="muted">${fields.filter(f=>f[0]!=='name').map(f=>`${esc(f[1])}: ${esc(x[f[0]])}`).join(' / ')}</div><div class="actions"><button data-edit="${esc(x.id)}">編集</button><button class="danger" data-delete="${esc(x.id)}">削除</button></div></div>`).join('')||'<p class="muted">まだ登録がありません。</p>'}</section><section class="panel"><h2>${current?'登録内容を編集':'新規登録'}</h2><form id="recordform">${fields.map(([key,label,type])=>`<label>${label}${key==='notes'?`<textarea name="${key}">${esc(current?.[key]??'')}</textarea>`:`<input name="${key}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(current?.[key]??(type==='number'?0:''))}" ${key==='name'?'required maxlength="150"':''}>`}</label>`).join('')}<div class="row"><button type="submit" class="primary">${current?'更新する':'登録する'}</button>${current?'<button type="button" id="cancel">キャンセル</button>':''}</div></form></section>`}function events(){return`<section class="panel"><h2>イベント履歴 (${state.events.length})</h2><form id="eventform"><label>記録内容<textarea id="eventtext" required maxlength="4000" placeholder="王命、戦果、外交、重要決定など"></textarea></label><button class="primary">履歴を追加</button></form></section><section class="panel">${state.events.map(e=>`<div class="item"><small>${esc(e.at)}</small><div>${esc(e.text)}</div><div class="actions"><button data-eventdelete="${esc(e.id)}" class="danger">削除</button></div></div>`).join('')||'履歴はありません。'}</section>`}function tools(){return`<section class="panel"><h2>D20判定</h2><label>難易度DC<input id="dc" type="number" value="12"></label><label>補正合計<input id="mod" type="number" value="0"></label><label>判定の説明<input id="rollnote" placeholder="例：交渉判定"></label><button class="primary" id="roll">D20を振る（振り直し不可）</button><div id="rollresult" class="notice" style="margin-top:12px">判定前にDCと補正を確認してください。</div></section><section class="panel"><h2>セーブ管理</h2><p>JSON形式で全台帳・履歴を出力します。別端末へ移す場合もこのファイルを利用してください。</p><div class="actions"><button class="primary" id="export">JSONを書き出す</button><button id="import">JSONを読み込む</button><button id="reset" class="danger">全データ初期化</button></div></section><section class="panel"><h2>現バージョンの範囲</h2><p>v0.1はローカル台帳・時間・収益・研究・建築・ダイス・履歴・バックアップを実装しています。AI GM、戦術図、複雑な戦闘、HP/MP自動回復、国家・兵器の自動数値生成は今後の開発対象です。</p></section>`}function wire(){document.querySelectorAll('[data-advance]').forEach(b=>b.onclick=()=>advance(+b.dataset.advance));$('nextturn')?.addEventListener('click',()=>{state.turn++;log('第'+state.turn+'幕開始');save();render()});$('settings')?.addEventListener('click',()=>{let d=+$('day').value,h=+$('hour').value,m=+$('minute').value;if(!(d>=1&&d<=50&&h>=0&&h<24&&m>=0&&m<60))return alert('日時の範囲を確認してください');Object.assign(state,{world:$('world').value||'新規キャンペーン',playerNation:$('player').value,season:$('season').value,day:d,hour:h,minute:m});log('キャンペーン設定更新');save();render()});$('recordform')?.addEventListener('submit',e=>{e.preventDefault();const k=tab,form=new FormData(e.target),obj={id:edit?.id||uid()};for(const [key,,type]of schemas[k])obj[key]=type==='number'?num(form.get(key)):String(form.get(key)||'').trim();if(!obj.name)return;const i=state[k].findIndex(x=>x.id===obj.id);if(i<0)state[k].push(obj);else state[k][i]=obj;log(`${kinds[k]}「${obj.name}」${i<0?'登録':'更新'}`);edit=null;save();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit={kind:tab,id:b.dataset.edit};render();$('recordform').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const i=state[tab].findIndex(x=>x.id===b.dataset.delete);if(i<0)return;if(confirm('「'+state[tab][i].name+'」を削除しますか？')){log(`${kinds[tab]}「${state[tab][i].name}」削除`);state[tab].splice(i,1);save();render()}});$('cancel')?.addEventListener('click',()=>{edit=null;render()});$('eventform')?.addEventListener('submit',e=>{e.preventDefault();const v=$('eventtext').value.trim();if(v){log(v);save();render()}});document.querySelectorAll('[data-eventdelete]').forEach(b=>b.onclick=()=>{if(confirm('履歴を削除しますか？')){state.events=state.events.filter(e=>e.id!==b.dataset.eventdelete);save();render()}});$('roll')?.addEventListener('click',()=>{const dc=num($('dc').value),mod=num($('mod').value),note=$('rollnote').value.trim(),r=secureDie(20),total=r+mod,ok=r===20?true:r===1?false:total>=dc;const result=`${note||'D20判定'} / DC ${dc} / 補正 ${mod>=0?'+':''}${mod} / 出目 ${r} / 合計 ${total} / ${r===20?'自然20・':r===1?'自然1・':''}${ok?'成功':'失敗'}`;$('rollresult').textContent=result;log(result);save()});$('export')?.addEventListener('click',exportData);$('exportHome')?.addEventListener('click',exportData);$('import')?.addEventListener('click',()=>$('file').click());$('reset')?.addEventListener('click',()=>{if(confirm('全データを初期化します。バックアップ済みですか？')&&confirm('本当にすべて消去しますか？')){state=fresh();save();render()}})}function secureDie(sides){const a=new Uint32Array(1),limit=Math.floor(4294967296/sides)*sides;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%sides+1}function daily(){const key=(state.year||1)+':'+state.season+':'+state.day;if(state.lastDailyKey===key||((state.year||1)===1&&state.lastDailyKey===state.season+':'+state.day))return;for(const n of state.nations){let income=num(n.income);for(const b of state.buildings)if(b.nation===n.name&&num(b.daysLeft)<=0)income+=num(b.income);n.treasury=num(n.treasury)+income}for(const r of state.research)if(num(r.target)>num(r.progress))r.progress=Math.min(num(r.target),num(r.progress)+num(r.daily));for(const b of state.buildings)if(num(b.daysLeft)>0)b.daysLeft=Math.max(0,num(b.daysLeft)-1);state.lastDailyKey=key;log('06:00 日次収益・研究・建築工期を計上')}function tickMinute(){state.minute++;if(state.minute>=60){state.minute=0;state.hour++}if(state.hour>=24){state.hour=0;state.day++;if(state.day>50){state.day=1;let s=['春','夏','秋','冬'],i=s.indexOf(state.season);state.season=s[(i+1)%4];if(i===3)state.year=(state.year||1)+1}}if(state.hour===6&&state.minute===0)daily()}function advance(hours){if(!Number.isInteger(hours)||hours<1||hours>24)return;for(let i=0;i<hours*60;i++)tickMinute();log(hours+'時間経過');save();render()}function exportData(){const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='VALDIA_save_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('バックアップを作成しました')}$('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('10MBを超えています');const d=JSON.parse(await file.text());if(!d||d.version!==1||!Object.keys(kinds).every(k=>Array.isArray(d[k]))||!['春','夏','秋','冬'].includes(d.season)||!Number.isInteger(d.day)||d.day<1||d.day>50||!Number.isInteger(d.hour)||d.hour<0||d.hour>23||!Number.isInteger(d.minute)||d.minute<0||d.minute>59)throw Error('形式が異なります');if(confirm('現在のデータを読み込んだデータで置き換えますか？')){if(!Number.isInteger(d.year)||d.year<1)d.year=1;state=d;save();edit=null;tab='home';render();notify('読み込み完了')}}catch(err){alert('読み込み失敗: '+err.message)}e.target.value=''});render();
</script><style>

<button id="v2open" type="button">戦術図・画像・資料</button><section id="v2pane" aria-label="VALDIA拡張機能"><div class="v2head"><h2>VALDIA <small>v0.2.1 拡張</small></h2><button id="v2close" type="button">閉じる ×</button></div><div class="v2tabs"><button data-v2tab="map" class="active">戦術図</button><button data-v2tab="gallery">画像</button><button data-v2tab="proposals">GM提案</button><button data-v2tab="rules">正式資料</button><button data-v2tab="backup">保存</button></div><div id="v2content"></div></section>
<script>
(()=>{'use strict';const KEY='valdia-v02-extension';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?.()||String(Date.now())+Math.random();const empty=()=>({version:2,units:[],images:[],proposals:[],history:[],map:{terrain:'丘陵・街道',note:'',width:600,height:400}});let d;try{d=JSON.parse(localStorage.getItem(KEY))||empty();if(!Array.isArray(d.units)||!Array.isArray(d.images)||!Array.isArray(d.proposals))throw Error()}catch{d=empty()}let tab='map';function save(){localStorage.setItem(KEY,JSON.stringify(d))}function log(s){d.history.unshift({time:new Date().toISOString(),text:s});save()}function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function show(){document.querySelectorAll('[data-v2tab]').forEach(x=>x.classList.toggle('active',x.dataset.v2tab===tab));$('v2content').innerHTML=({map:mapUI,gallery:galleryUI,proposals:proposalsUI,rules:rulesUI,backup:backupUI})[tab]();bind()}function baseUI(){return '<p class="v2small">戦場の部隊をタップして詳細を確認できます。白背景の図はSVGで描画され、座標・兵数を保存します。</p>'}function mapSVG(){const W=600,H=400;let t=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 ${W} ${H}" role="img" aria-label="白背景の戦術概略図"><rect width="600" height="400" fill="#fff"/><path d="M15 110 Q120 45 245 112 T580 88" stroke="#9ca3af" stroke-width="24" fill="none" opacity=".55"/><path d="M0 305 Q155 250 290 305 T600 265" stroke="#e4c9a1" stroke-width="20" fill="none"/><path d="M0 305 Q155 250 290 305 T600 265" stroke="#9b7a50" stroke-width="2" stroke-dasharray="8 5" fill="none"/><path d="M365 0 Q330 110 395 180 T365 400" stroke="#93c5fd" stroke-width="19" fill="none"/><path d="M365 0 Q330 110 395 180 T365 400" stroke="#0284c7" stroke-width="2" fill="none"/><text x="15" y="24" font-size="16" fill="#334155">${esc(d.map.terrain)}</text><text x="552" y="25" font-size="15" fill="#111827">北 ↑</text>`;for(const u of d.units){const x=Math.max(30,Math.min(570,Number(u.x)||30)),y=Math.max(45,Math.min(365,Number(u.y)||45));t+=`<g data-unit="${esc(u.id)}"><circle cx="${x}" cy="${y}" r="25" fill="${u.side==='enemy'?'#dc2626':u.side==='neutral'?'#64748b':'#2563eb'}" stroke="#1f2937" stroke-width="2"/><text x="${x}" y="${y+5}" font-size="16" text-anchor="middle" font-weight="bold" fill="white">${esc(u.troops)}</text><text x="${x}" y="${y+42}" font-size="13" text-anchor="middle" fill="#111827">${esc(u.name).slice(0,18)}</text></g>`}return t+'</svg>'}function mapUI(){return `<div class="v2card">${baseUI()}<div class="v2map">${mapSVG()}</div><p class="v2small">${esc(d.map.note)}</p><div class="v2row"><button id="v2png">図をPNG保存</button><button id="v2svg">SVG保存</button></div></div><div class="v2card"><h3>部隊を配置・更新</h3><label>部隊名<input id="v2name" placeholder="例：黒冠主力軍"></label><div class="row"><label>兵数<input id="v2troops" type="number" min="0" value="100"></label><label>所属<select id="v2side"><option value="ally">味方</option><option value="enemy">敵</option><option value="neutral">中立</option></select></label></div><div class="row"><label>X座標（0〜600）<input id="v2x" type="number" min="0" max="600" value="160"></label><label>Y座標（0〜400）<input id="v2y" type="number" min="0" max="400" value="190"></label></div><button id="v2addunit" class="primary">部隊を追加</button><label>地形の名称<input id="v2terrain" value="${esc(d.map.terrain)}"></label><label>戦況メモ<textarea id="v2mapnote">${esc(d.map.note)}</textarea></label><button id="v2savemap">地形・メモを保存</button></div><div class="v2card"><h3>登録部隊（${d.units.length}）</h3>${d.units.map(u=>`<div class="item"><strong>${esc(u.name)}</strong> ${esc(u.troops)}名（${u.side==='ally'?'味方':u.side==='enemy'?'敵':'中立'}）座標 ${u.x}, ${u.y}<div class="actions"><button data-move="${esc(u.id)}">座標・兵数変更</button><button data-remove="${esc(u.id)}">削除</button></div></div>`).join('')||'まだ部隊はありません。'}</div>`}function galleryUI(){return `<div class="v2card"><h3>場面イメージ画像</h3><p class="v2small">端末から画像を追加します。画像はブラウザ内に保存され、外部のAI画像生成は行いません。大量の画像は容量制限に注意してください。</p><label>画像名<input id="v2imname" placeholder="例：黒冠王の玉座"></label><input id="v2imagefile" type="file" accept="image/png,image/jpeg,image/webp"><button id="v2addimage">画像を保存</button></div><div class="v2gallery">${d.images.map(im=>`<div class="v2card"><img src="${im.data}" alt="${esc(im.name)}"><strong>${esc(im.name)}</strong><button data-imgdel="${esc(im.id)}">削除</button></div>`).join('')}</div>`}function proposalsUI(){return `<div class="v2card"><h3>GM提案 → プレイヤー承認 → 確定</h3><p class="v2small">正式第19次に従い、国家創造はD20・NCPを使いません。数値は一律係数から自動確定せず、根拠を添えて提案として登録します。AIによる自動提案は未実装です。</p><label>提案の種類<select id="v2ptype"><option>国家</option><option>兵器</option><option>建築物</option><option>その他</option></select></label><label>名称<input id="v2pname" placeholder="新国家・新兵器など"></label><label>提案値・根拠・費用・工期・維持費<textarea id="v2pdetails" placeholder="根拠付きの数値案を記入"></textarea></label><button id="v2addproposal" class="primary">未確定案として登録</button></div><div class="v2card"><h3>承認管理</h3>${d.proposals.map(p=>`<div class="item"><span class="v2badge">${esc(p.status)}</span> <strong>${esc(p.type)}：${esc(p.name)}</strong><p>${esc(p.details)}</p>${p.status==='未確定'?`<div class="actions"><button data-approve="${esc(p.id)}">承認して確定</button><button data-reject="${esc(p.id)}">却下</button></div>`:''}</div>`).join('')||'登録済み提案はありません。'}</div>`}function rulesUI(){return `<div class="v2card"><h3>正式ルール資料 v17.0</h3><p class="v2small">添付された正式バックアップのルート階層の文書を参照できます。原本111ファイルは同梱ZIPに保存しています。</p><div id="v2ruleslist">資料一覧を読み込み中…</div><div id="v2ruledetail"></div></div>`}function backupUI(){return `<div class="v2card"><h3>拡張機能のバックアップ</h3><p class="v2small">v0.1本体のセーブとは別です。両方を書き出してください。画像が多いと容量が増えます。</p><button id="v2export">拡張データをJSON保存</button><label>拡張データを読み込む<input id="v2import" type="file" accept=".json"></label><p class="v2small">旧v0.1の国家・人物・研究・建築は既存画面で管理します。正式暦の200日年（各季節50日・半年100日）に修正しています。</p></div>`}function bind(){if(tab==='map'){$('v2addunit').onclick=()=>{let name=$('v2name').value.trim(),troops=Number($('v2troops').value),x=Number($('v2x').value),y=Number($('v2y').value);if(!name||![troops,x,y].every(Number.isFinite)||troops<0||x<0||x>600||y<0||y>400)return alert('名称・兵数・座標を確認してください');d.units.push({id:id(),name,troops,x,y,side:$('v2side').value});log('部隊登録：'+name);show()};$('v2savemap').onclick=()=>{d.map.terrain=$('v2terrain').value;d.map.note=$('v2mapnote').value;log('戦場情報更新');show()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('この部隊を削除しますか？')){d.units=d.units.filter(u=>u.id!==b.dataset.remove);log('部隊削除');show()}});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const u=d.units.find(u=>u.id===b.dataset.move);if(!u)return;const a=prompt('X,Y,兵数（カンマ区切り）',`${u.x},${u.y},${u.troops}`);if(a===null)return;const v=a.split(',').map(Number);if(v.length!==3||!v.every(Number.isFinite)||v[0]<0||v[0]>600||v[1]<0||v[1]>400||v[2]<0)return alert('数値が不正です');[u.x,u.y,u.troops]=v;log('部隊変更：'+u.name);show()});$('v2svg').onclick=()=>download('VALDIA_map.svg',mapSVG(),'image/svg+xml');$('v2png').onclick=()=>{const source=mapSVG();const svg=new Blob([source],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(svg),img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=1200;c.height=800;const ctx=c.getContext('2d');if(!ctx)throw Error('Canvasが利用できません');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,1200,800);ctx.drawImage(img,0,0,1200,800);c.toBlob(b=>{if(b)download('VALDIA_map.png',b,'image/png');else alert('PNGの生成に失敗しました');URL.revokeObjectURL(url)},'image/png')}catch(e){URL.revokeObjectURL(url);alert('PNG保存に失敗しました: '+e.message)}};img.onerror=()=>{URL.revokeObjectURL(url);alert('画像変換に失敗しました')};img.src=url}}if(tab==='gallery'){$('v2addimage').onclick=()=>{const f=$('v2imagefile').files[0],name=$('v2imname').value.trim();if(!f||!name)return alert('画像と名前を指定してください');if(f.size>2*1024*1024)return alert('2MB以下の画像を選んでください');const r=new FileReader();r.onload=()=>{d.images.push({id:id(),name,data:r.result});try{log('画像登録：'+name);show()}catch(e){d.images.pop();alert('保存容量が不足しています。画像を減らしてください')}};r.readAsDataURL(f)};document.querySelectorAll('[data-imgdel]').forEach(b=>b.onclick=()=>{if(confirm('画像を削除しますか？')){d.images=d.images.filter(x=>x.id!==b.dataset.imgdel);log('画像削除');show()}})}if(tab==='proposals'){$('v2addproposal').onclick=()=>{const name=$('v2pname').value.trim(),details=$('v2pdetails').value.trim();if(!name||!details)return alert('名称と数値・根拠を入力してください');d.proposals.push({id:id(),name,details,type:$('v2ptype').value,status:'未確定'});log('提案登録：'+name);show()};for(const attr of ['approve','reject'])document.querySelectorAll('[data-'+attr+']').forEach(b=>b.onclick=()=>{const p=d.proposals.find(p=>p.id===b.dataset[attr]);if(!p)return;if(attr==='approve'&&!confirm('この提案を正式確定しますか？'))return;p.status=attr==='approve'?'確定':'却下';log(p.status+'：'+p.name);show()})}if(tab==='rules'){fetch('rules-index.json').then(r=>{if(!r.ok)throw Error('未配置');return r.json()}).then(items=>{$('v2ruleslist').innerHTML='<label>資料を選択<select id="v2ruleselect"><option value="">選択してください</option>'+items.map(i=>`<option value="${esc(i.path)}">${esc(i.name)}</option>`).join('')+'</select></label>';$('v2ruleselect').onchange=()=>{const path=$('v2ruleselect').value;if(!path)return;$('v2ruledetail').textContent='読み込み中…';fetch(encodeURI(path)).then(r=>{if(!r.ok)throw Error('読込不可');return r.text()}).then(t=>{$('v2ruledetail').innerHTML='<pre></pre>';$('v2ruledetail').querySelector('pre').textContent=t}).catch(e=>$('v2ruledetail').textContent=e.message)}}).catch(e=>$('v2ruleslist').textContent='資料が見つかりません。ZIP内のrulesフォルダーもアップロードしてください。')}if(tab==='backup'){$('v2export').onclick=()=>download('VALDIA_v02_extension.json',JSON.stringify(d,null,2),'application/json');$('v2import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(x.version!==2||!Array.isArray(x.units)||!Array.isArray(x.images)||!Array.isArray(x.proposals))throw Error('形式が違います');if(confirm('拡張データを置き換えますか？')){d=x;save();show()}}catch(e){alert('読み込み失敗：'+e.message)}}}}$('v2open').onclick=()=>{$('v2pane').classList.add('on');show()};$('v2close').onclick=()=>$('v2pane').classList.remove('on');document.querySelectorAll('[data-v2tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.v2tab;show()});})();
</script>

<style>
#v3open{position:fixed;right:12px;bottom:114px;z-index:7;background:#386b63;border-color:#75b7a6;color:white;box-shadow:0 4px 14px #0009}#v3pane{display:none;position:fixed;inset:0;z-index:12;background:#0d131c;overflow:auto;padding:16px 14px 90px;color:#eaf0f7}#v3pane.on{display:block}#v3pane .v3head{display:flex;align-items:center;justify-content:space-between}#v3pane .v3tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}#v3pane .v3tabs button{white-space:nowrap;font-size:13px}#v3pane .v3tabs button.active{background:#386b63}#v3pane .v3card{background:#192332;border:1px solid #35465b;border-radius:12px;padding:14px;margin:10px 0}#v3pane .v3muted{color:#a9b7c8;font-size:13px}#v3pane .v3item{border-bottom:1px solid #35465b;padding:12px 0;overflow-wrap:anywhere}#v3pane .v3item:last-child{border:0}#v3pane .v3actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}#v3pane .v3actions button{font-size:13px}#v3pane .v3tag{font-size:12px;background:#34475a;border-radius:5px;padding:2px 7px}#v3pane textarea{min-height:85px}#v3pane .v3two{display:grid;grid-template-columns:1fr 1fr;gap:8px}#v3pane .v3two>*{min-width:0}
</style>
<button type="button" id="v3open">統合台帳 v0.3</button>
<section id="v3pane" aria-label="VALDIA統合台帳"><div class="v3head"><h2>VALDIA <small>v0.3 台帳</small></h2><button id="v3close">閉じる ×</button></div><div class="v3tabs"><button data-v3tab="overview">概要</button><button data-v3tab="ledger">正式台帳</button><button data-v3tab="propose">GM数値案</button><button data-v3tab="pending">進行案件</button><button data-v3tab="audit">変更履歴</button><button data-v3tab="backup">保存</button></div><div id="v3content"></div></section>
<script>
(()=>{'use strict';
const KEY='valdia-v03-ledger',BASE='valdia-v01-save',EXT='valdia-v02-extension';
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const fresh=()=>({version:3,records:[],proposals:[],pending:[],audit:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh();if(db.version!==3||!['records','proposals','pending','audit'].every(k=>Array.isArray(db[k])))throw Error('format')}catch(e){db=fresh()}
let tab='overview';const now=()=>new Date().toISOString();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('端末の保存容量が不足しています。JSONバックアップを保存してください。');return false}}
function audit(action,detail){db.audit.unshift({id:uid(),at:now(),action,detail});persist()}
function getJSON(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return null}}
function getBase(){return getJSON(BASE)||{nations:[],units:[],characters:[],research:[],buildings:[],events:[]}}
function getExt(){return getJSON(EXT)||{units:[],images:[],proposals:[]}}
function fileDownload(name,content){const b=new Blob([JSON.stringify(content,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function fmt(v){return Number(v).toLocaleString('ja-JP',{maximumFractionDigits:4})}
const types=['国家','兵器','収益建築物','軍団','人物','研究','その他'];
function nav(){document.querySelectorAll('[data-v3tab]').forEach(b=>b.classList.toggle('active',b.dataset.v3tab===tab))}
function overview(){const b=getBase(),e=getExt();return `<div class="v3card"><h3>登録状況</h3><p>既存国家 ${b.nations?.length||0} / 軍団 ${b.units?.length||0} / 人物 ${b.characters?.length||0} / 研究 ${b.research?.length||0} / 建築 ${b.buildings?.length||0}</p><p>戦術図の部隊 ${e.units?.length||0} / v0.3正式台帳 ${db.records.length} / 未承認案 ${db.proposals.filter(x=>x.status==='未承認').length} / 未完了案件 ${db.pending.filter(x=>x.status!=='完了'&&x.status!=='中止').length}</p><p class="v3muted">既存の台帳と戦術図は読み取り専用で参照します。v0.3の正式台帳は別に保存され、既存データを上書きしません。</p></div><div class="v3card"><h3>正式暦</h3><p>春・夏・秋・冬 各50日 / 半年100日 / 1年200日</p><p class="v3muted">06:00日次計上は従来の本体機能が担当します。v0.3側では重複計上しません。</p></div><div class="v3card"><h3>運用ルール</h3><p>数値案は暫定です。GM提案 → 承認 → 正式台帳登録の順に処理します。新規建築は費用・工期を提示し、承認前に着工しません。</p><p class="v3muted">この版の数値案は入力情報に基づく簡易計算です。AIによる世界観判断や戦闘裁定は未実装です。</p></div>`}
function ledger(){return `<div class="v3card"><h3>正式台帳 (${db.records.length})</h3><label>種類で絞り込み<select id="v3filter"><option value="">すべて</option>${types.map(t=>`<option>${t}</option>`).join('')}</select></label><div id="v3records">${recordItems('')}</div></div><div class="v3card"><h3>正式台帳へ手動登録</h3><label>種類<select id="v3rtype">${types.map(t=>`<option>${t}</option>`).join('')}</select></label><label>名称<input id="v3rname" maxlength="150" placeholder="正式名称"></label><label>数値・詳細（JSONまたは文章）<textarea id="v3rdetails" placeholder="人口、兵数、HP、維持費、効果、収益、工期など"></textarea></label><label>確定根拠<textarea id="v3rwhy" placeholder="王命・GM裁定・正式資料など"></textarea></label><button id="v3radd" class="primary">正式台帳に登録</button></div>`}
function recordItems(filter){const a=db.records.filter(r=>!filter||r.type===filter);return a.map(r=>`<div class="v3item"><span class="v3tag">${esc(r.type)}</span> <strong>${esc(r.name)}</strong> <small>改訂${r.revision||1}</small><p>${esc(r.details)}</p><p class="v3muted">根拠：${esc(r.reason)} / ${esc(r.updated)}</p><div class="v3actions"><button data-v3edit="${esc(r.id)}">改訂</button><button data-v3archive="${esc(r.id)}">廃止</button></div></div>`).join('')||'<p class="v3muted">該当する記録はありません。</p>'}
function propose(){return `<div class="v3card"><h3>新規数値案を作成</h3><p class="v3muted">入力値から目安を算出します。確定値ではありません。根拠を修正してから承認してください。</p><label>種類<select id="v3ptype"><option>国家</option><option>兵器</option><option>収益建築物</option></select></label><label>名称<input id="v3pname" maxlength="150" placeholder="名称"></label><div class="v3two"><label>規模・基準値<input id="v3scale" type="number" min="1" step="1" value="100"></label><label>等級<select id="v3tier"><option value="1">標準</option><option value="1.5">上級</option><option value="2">最高級</option></select></label></div><label>状況・根拠の補足<textarea id="v3context" placeholder="資源、地形、技術水準、既存国家との比較など"></textarea></label><button id="v3generate" class="primary">数値案を生成</button><div id="v3preview"></div></div><div class="v3card"><h3>承認待ち・裁定済み (${db.proposals.length})</h3>${db.proposals.map(p=>`<div class="v3item"><span class="v3tag">${esc(p.status)}</span> <strong>${esc(p.type)}：${esc(p.name)}</strong><p>${esc(p.details)}</p><p class="v3muted">根拠：${esc(p.reason)}</p>${p.status==='未承認'?`<div class="v3actions"><button data-v3approve="${esc(p.id)}">承認して正式登録</button><button data-v3reject="${esc(p.id)}">却下</button></div>`:''}</div>`).join('')||'<p class="v3muted">提案はありません。</p>'}</div>`}
function calc(type,scale,tier,context){const n=Math.max(1,Math.floor(scale)),t=Number(tier);let details='',reason='';if(type==='国家'){const pop=n,troops=Math.round(pop*.08*t),income=Math.round(pop*.025*t*100)/100,treasury=Math.round(income*30);details=`人口 ${fmt(pop)} / 想定兵力 ${fmt(troops)} / 日次純収益 ${fmt(income)} / 初期国庫目安 ${fmt(treasury)}`;reason=`人口を基準に仮置き（兵力8%×等級、日次純収益0.025×人口×等級、国庫30日分）。他国比較・食料・兵站で要調整。`}
else if(type==='兵器'){const cost=Math.round(n*10*t),hp=Math.round(n*.8*t),power=Math.round(Math.sqrt(n)*t*2),upkeep=Math.round(cost*.01*100)/100;details=`製造費 ${fmt(cost)} / 耐久HP目安 ${fmt(hp)} / 威力指標 ${fmt(power)} / 日次維持費 ${fmt(upkeep)} / 製造工期目安 ${Math.max(1,Math.ceil(n/50*t))}日`;reason='規模指数から算出した比較用仮値。兵器の種類・技術・資源・戦術効果に応じてGMが調整する。'}
else{const cost=Math.round(n*10*t),income=Math.round(n*.15*t*100)/100,days=Math.max(1,Math.ceil(n/25*t)),upkeep=Math.round(income*.2*100)/100;details=`建築費 ${fmt(cost)} / 工期 ${days}日 / 日次総収益 ${fmt(income)} / 日次維持費 ${fmt(upkeep)} / 日次純収益 ${fmt(income-upkeep)}`;reason='規模指数を基準にした建築案。需要・立地・市場・人員・既存収益との二重計上を確認する。承認まで未着工。'}
if(context.trim())reason+=' 補足：'+context.trim();return {details,reason}}
function pending(){return `<div class="v3card"><h3>進行中案件を追加</h3><label>案件名<input id="v3tname" maxlength="150" placeholder="例：K-03改造試験"></label><label>担当者<input id="v3towner" maxlength="100" placeholder="担当者・部署"></label><label>期限（ゲーム内日時）<input id="v3tdue" maxlength="100" placeholder="例：夏14日 18:00 / 未設定"></label><label>残り時間・次の処理<textarea id="v3tnext" placeholder="次に必要な行動、残り時間、完了条件"></textarea></label><button id="v3tadd" class="primary">案件を登録</button></div><div class="v3card"><h3>案件一覧 (${db.pending.length})</h3>${db.pending.map(p=>`<div class="v3item"><span class="v3tag">${esc(p.status)}</span> <strong>${esc(p.name)}</strong><p>担当：${esc(p.owner||'未指定')} / 期限：${esc(p.due||'未設定')}</p><p>${esc(p.next)}</p><div class="v3actions">${p.status!=='完了'&&p.status!=='中止'?`<button data-v3progress="${esc(p.id)}">進捗を更新</button><button data-v3done="${esc(p.id)}">完了</button><button data-v3cancel="${esc(p.id)}">中止</button>`:''}</div></div>`).join('')||'<p class="v3muted">案件はありません。</p>'}</div>`}
function history(){return `<div class="v3card"><h3>変更履歴 (${db.audit.length})</h3><p class="v3muted">確定・改訂・却下・案件更新を追記します。通常画面から履歴は削除できません。端末の保存データ自体の改ざん防止機能ではありません。</p>${db.audit.map(x=>`<div class="v3item"><small>${esc(x.at)}</small><p><strong>${esc(x.action)}</strong>：${esc(x.detail)}</p></div>`).join('')||'履歴はありません。'}</div>`}
function backup(){return `<div class="v3card"><h3>全データをまとめて保存</h3><p class="v3muted">v0.1本体、v0.2戦術図・画像、v0.3正式台帳・案件を1ファイルに保存します。</p><button id="v3export" class="primary">統合JSONバックアップ</button><label>統合JSONを読み込む<input id="v3import" type="file" accept=".json,application/json"></label><p class="v3muted">読み込みは3種類の保存データを置き換えます。必ず現在のバックアップを先に保存してください。</p></div>`}
function show(){nav();$('v3content').innerHTML=({overview,ledger,propose,pending,audit:history,backup})[tab]();bind()}
function addRecord(type,name,details,reason){const record={id:uid(),type,name,details,reason,revision:1,created:now(),updated:now()};db.records.push(record);audit('正式登録',type+'「'+name+'」：'+details);return record}
function bind(){if(tab==='ledger'){$('v3filter').onchange=e=>{$('v3records').innerHTML=recordItems(e.target.value);bindRecordActions()};$('v3radd').onclick=()=>{const name=$('v3rname').value.trim(),details=$('v3rdetails').value.trim(),reason=$('v3rwhy').value.trim();if(!name||!details||!reason)return alert('名称・詳細・確定根拠を入力してください');if(!confirm('正式台帳に確定登録しますか？'))return;addRecord($('v3rtype').value,name,details,reason);show()};bindRecordActions()}
if(tab==='propose'){$('v3generate').onclick=()=>{const type=$('v3ptype').value,name=$('v3pname').value.trim(),scale=Number($('v3scale').value),tier=$('v3tier').value,context=$('v3context').value;if(!name||!Number.isSafeInteger(scale)||scale<1||scale>100000000)return alert('名称と規模（1〜1億の整数）を確認してください');const c=calc(type,scale,tier,context);$('v3preview').innerHTML=`<div class="v3card"><strong>暫定案：${esc(name)}</strong><p>${esc(c.details)}</p><label>数値案（編集可能）<textarea id="v3pd">${esc(c.details)}</textarea></label><label>算定根拠（編集可能）<textarea id="v3pr">${esc(c.reason)}</textarea></label><button id="v3psave" class="primary">未承認案として保存</button></div>`;$('v3psave').onclick=()=>{const details=$('v3pd').value.trim(),reason=$('v3pr').value.trim();if(!details||!reason)return alert('数値案と根拠を入力してください');db.proposals.push({id:uid(),type,name,details,reason,status:'未承認',created:now()});audit('GM暫定案',type+'「'+name+'」：'+details);show()}};
for(const action of ['approve','reject'])document.querySelectorAll('[data-v3'+action+']').forEach(b=>b.onclick=()=>{const p=db.proposals.find(x=>x.id===b.dataset['v3'+action]);if(!p||p.status!=='未承認')return;if(action==='approve'){if(!confirm('数値案を正式承認しますか？ 建築の場合は費用・工期を承認し着工の可否を別途判断してください。'))return;p.status='承認済';addRecord(p.type,p.name,p.details,p.reason+' / GM提案承認')}else{if(!confirm('提案を却下しますか？'))return;p.status='却下'}audit('提案'+p.status,p.type+'「'+p.name+'」');show()})}
if(tab==='pending'){$('v3tadd').onclick=()=>{const name=$('v3tname').value.trim();if(!name)return alert('案件名を入力してください');db.pending.push({id:uid(),name,owner:$('v3towner').value.trim(),due:$('v3tdue').value.trim(),next:$('v3tnext').value.trim(),status:'進行中',updated:now()});audit('案件登録',name);show()};for(const action of ['progress','done','cancel'])document.querySelectorAll('[data-v3'+action+']').forEach(b=>b.onclick=()=>{const p=db.pending.find(x=>x.id===b.dataset['v3'+action]);if(!p)return;if(action==='progress'){const x=prompt('新しい進捗・次の処理（必要なら残り時間も記載）',p.next);if(x===null)return;p.next=x;p.status='進行中'}else{if(!confirm(p.name+'を'+(action==='done'?'完了':'中止')+'にしますか？'))return;p.status=action==='done'?'完了':'中止'}p.updated=now();audit('案件'+p.status,p.name+' / '+p.next);show()})}
if(tab==='backup'){$('v3export').onclick=()=>fileDownload('VALDIA_full_backup_'+new Date().toISOString().slice(0,10)+'.json',{format:'VALDIA-full-backup',version:1,created:now(),base:getBase(),extension:getExt(),ledger:db});$('v3import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('20MBを超えています');const x=JSON.parse(await f.text());if(x.format!=='VALDIA-full-backup'||x.version!==1||x.base?.version!==1||x.extension?.version!==2||x.ledger?.version!==3||!['records','proposals','pending','audit'].every(k=>Array.isArray(x.ledger[k]))||!['nations','units','characters','research','buildings','events'].every(k=>Array.isArray(x.base[k]))||!['units','images','proposals'].every(k=>Array.isArray(x.extension[k])))throw Error('統合バックアップ形式ではありません');if(!confirm('現在の3種類のデータをすべて置き換えます。続行しますか？'))return;const old=[localStorage.getItem(BASE),localStorage.getItem(EXT),localStorage.getItem(KEY)];try{localStorage.setItem(BASE,JSON.stringify(x.base));localStorage.setItem(EXT,JSON.stringify(x.extension));localStorage.setItem(KEY,JSON.stringify(x.ledger))}catch(err){for(let i=0;i<3;i++){try{old[i]===null?localStorage.removeItem([BASE,EXT,KEY][i]):localStorage.setItem([BASE,EXT,KEY][i],old[i])}catch(_){} }throw err}db=x.ledger;alert('統合バックアップを復元しました。既存画面を反映するためページを再読み込みしてください。');show()}catch(err){alert('復元できません：'+err.message)}e.target.value=''}}}
function bindRecordActions(){document.querySelectorAll('[data-v3edit]').forEach(b=>b.onclick=()=>{const r=db.records.find(x=>x.id===b.dataset.v3edit);if(!r)return;const details=prompt('改訂後の詳細',r.details);if(details===null||!details.trim())return;const reason=prompt('改訂理由（必須）','');if(reason===null||!reason.trim())return;const old=r.details;r.details=details.trim();r.reason=reason.trim();r.revision=(r.revision||1)+1;r.updated=now();audit('正式台帳改訂',r.name+' / 旧：'+old+' / 新：'+r.details+' / 理由：'+r.reason);show()});document.querySelectorAll('[data-v3archive]').forEach(b=>b.onclick=()=>{const r=db.records.find(x=>x.id===b.dataset.v3archive);if(!r||!confirm('台帳から廃止しますか？変更履歴には記録されます。'))return;db.records=db.records.filter(x=>x.id!==r.id);audit('正式台帳廃止',r.type+'「'+r.name+'」：'+r.details);show()})}
$('v3open').onclick=()=>{$('v3pane').classList.add('on');tab='overview';show()};$('v3close').onclick=()=>$('v3pane').classList.remove('on');document.querySelectorAll('[data-v3tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.v3tab;show()});
})();
</script>
</body></html>
