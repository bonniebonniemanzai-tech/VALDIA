<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101722"><title>VALDIA v0.1</title><style>
:root{color-scheme:dark;--bg:#0d131c;--panel:#192332;--line:#35465b;--gold:#e7bd69;--text:#eaf0f7;--muted:#a9b7c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}header{padding:18px 16px;background:#111b29;border-bottom:1px solid var(--line)}h1{margin:0;color:var(--gold);letter-spacing:.12em;font-size:25px}h2{font-size:19px;color:var(--gold);margin:0 0 12px}h3{margin:8px 0}small,.muted{color:var(--muted)}main{max-width:850px;margin:auto;padding:15px 14px 110px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#101a28;padding:12px;border-radius:9px}.stat strong{display:block;color:var(--gold);font-size:20px;overflow-wrap:anywhere}button,input,select,textarea{font:inherit}button{background:#31445d;color:white;border:1px solid #526783;border-radius:8px;padding:10px 13px;cursor:pointer}button.primary{background:#886324;border-color:#b58b44}button.danger{background:#64363c}button:disabled{opacity:.5}input,select,textarea{width:100%;background:#0e1825;color:white;border:1px solid #4b6079;border-radius:8px;padding:10px;margin:5px 0 11px}textarea{min-height:80px}label{display:block;font-size:13px;color:#c8d4e2}nav{position:fixed;bottom:0;left:0;right:0;background:#101a28;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:3;padding-bottom:env(safe-area-inset-bottom)}nav button{min-width:80px;flex:1;border:0;border-radius:0;background:transparent;font-size:12px;padding:12px 6px}nav button.active{color:var(--gold);border-top:3px solid var(--gold)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.item{padding:11px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.item:last-child{border:0}.item strong{color:#f1d393}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{font-size:12px;padding:7px 10px}.hidden{display:none}.notice{padding:10px;background:#28344a;border-radius:8px;margin-bottom:10px}.success{color:#a9e5b5}.warn{color:#f4c38d}code{white-space:pre-wrap;overflow-wrap:anywhere}#toast{position:fixed;top:12px;right:12px;background:#284536;padding:10px;border-radius:8px;z-index:9;display:none}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>VALDIA <small>v0.1</small></h1><div class="muted">国家運営・戦争TRPG 統合台帳</div></header><main id="app"></main><nav id="nav"></nav><div id="toast" role="status"></div><input type="file" id="file" accept=".json,application/json" class="hidden"><script>
'use strict';const KEY='valdia-v01-save';const kinds={nations:'国家',units:'軍団',characters:'人物',research:'研究',buildings:'建築',events:'履歴'};const schemas={nations:[['name','国家名','text'],['population','人口','number'],['troops','兵力','number'],['treasury','国庫','number'],['income','日次収益','number'],['notes','備考','text']],units:[['name','部隊名','text'],['nation','所属国家','text'],['troops','兵数','number'],['morale','士気(0〜100)','number'],['notes','兵科・配置・備考','text']],characters:[['name','人物名','text'],['nation','所属','text'],['hp','HP','number'],['maxHp','最大HP','number'],['mp','MP','number'],['maxMp','最大MP','number'],['ap','AP','number'],['notes','技能・装備・備考','text']],research:[['name','研究名','text'],['progress','進捗','number'],['target','必要RP','number'],['daily','日次進捗','number'],['notes','備考','text']],buildings:[['name','建築物名','text'],['nation','所属国家','text'],['cost','建築費','number'],['income','日次収益','number'],['daysLeft','残工期(日)','number'],['notes','備考','text']]};function fresh(){return{version:1,world:'新規キャンペーン',season:'春',day:1,hour:8,minute:0,turn:1,playerNation:'',lastDailyKey:'',nations:[],units:[],characters:[],research:[],buildings:[],events:[]}}let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh();if(!state||state.version!==1)throw Error('version');for(const k of Object.keys(kinds))if(!Array.isArray(state[k]))state[k]=[]}catch(e){state=fresh()}let tab='home',edit=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number.isFinite(Number(v))?Number(v):0;const uid=()=>crypto?.randomUUID?.()||String(Date.now())+Math.random();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('保存に失敗しました。JSON書き出しでバックアップしてください。');return false}}function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}function log(t){state.events.unshift({id:uid(),at:dateText(),text:t});if(state.events.length>3000)state.events.length=3000}function dateText(){return`${esc(state.season)}${state.day}日 ${String(state.hour).padStart(2,'0')}:${String(state.minute).padStart(2,'0')}`}function render(){const tabs=[['home','概要'],['nations','国家'],['units','軍団'],['characters','人物'],['research','研究'],['buildings','建築'],['events','履歴'],['tools','道具']];$('nav').innerHTML=tabs.map(([id,n])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;edit=null;render()});$('app').innerHTML=tab==='home'?home():tab==='tools'?tools():tab==='events'?events():collection(tab);wire()}function home(){let treasury=state.nations.reduce((a,n)=>a+num(n.treasury),0),troops=state.units.reduce((a,u)=>a+num(u.troops),0);return`<section class="panel"><h2>${esc(state.world)}</h2><div class="muted">第${state.turn}幕 ・ ${dateText()}</div><div class="stats"><div class="stat">国家数<strong>${state.nations.length}</strong></div><div class="stat">登録軍団兵力<strong>${troops.toLocaleString()}</strong></div><div class="stat">国庫合計<strong>${treasury.toLocaleString()}</strong></div><div class="stat">進行研究<strong>${state.research.filter(x=>num(x.progress)<num(x.target)).length}</strong></div></div></section><section class="panel"><h2>時間進行</h2><div class="row"><button data-advance="1">+1時間</button><button data-advance="6">+6時間</button><button data-advance="24">+1日</button></div><p class="muted">06:00を通過すると、各国家の登録日次収益と研究進捗を自動計上します。建築の残工期も1日減算します。日次処理は重複しません。</p><button id="nextturn">次の幕へ</button></section><section class="panel"><h2>開始設定</h2><label>キャンペーン名<input id="world" value="${esc(state.world)}"></label><label>プレイヤー国家<select id="player"><option value="">未指定</option>${state.nations.map(n=>`<option value="${esc(n.id)}" ${state.playerNation===n.id?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label><div class="row"><label>季節<select id="season">${['春','夏','秋','冬'].map(s=>`<option ${state.season===s?'selected':''}>${s}</option>`).join('')}</select></label><label>日(1〜100)<input id="day" type="number" min="1" max="100" value="${state.day}"></label></div><div class="row"><label>時<input id="hour" type="number" min="0" max="23" value="${state.hour}"></label><label>分<input id="minute" type="number" min="0" max="59" value="${state.minute}"></label></div><button id="settings" class="primary">設定を保存</button><p class="warn">日時を手動変更しても過去の日次処理は自動再計算されません。</p></section><section class="panel"><h2>保存状態</h2><p>端末内に自動保存します。ただしブラウザデータ消去などで失われる可能性があります。必ず定期的にJSONバックアップを保存してください。</p><button id="exportHome" class="primary">セーブを書き出す</button></section>`}function collection(k){let fields=schemas[k],items=state[k];let current=edit&&edit.kind===k?items.find(x=>x.id===edit.id):null;return`<section class="panel"><h2>${kinds[k]}台帳 (${items.length})</h2><div class="notice">${k==='nations'?'国家の国庫と日次収益を登録します。':k==='buildings'?'建築物の日次収益は国家収益に含めず、完成後に所属国家へ別途加算します。':'登録・修正・削除は即時保存されます。'}</div>${items.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><div class="muted">${fields.filter(f=>f[0]!=='name').map(f=>`${esc(f[1])}: ${esc(x[f[0]])}`).join(' / ')}</div><div class="actions"><button data-edit="${esc(x.id)}">編集</button><button class="danger" data-delete="${esc(x.id)}">削除</button></div></div>`).join('')||'<p class="muted">まだ登録がありません。</p>'}</section><section class="panel"><h2>${current?'登録内容を編集':'新規登録'}</h2><form id="recordform">${fields.map(([key,label,type])=>`<label>${label}${key==='notes'?`<textarea name="${key}">${esc(current?.[key]??'')}</textarea>`:`<input name="${key}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(current?.[key]??(type==='number'?0:''))}" ${key==='name'?'required maxlength="150"':''}>`}</label>`).join('')}<div class="row"><button type="submit" class="primary">${current?'更新する':'登録する'}</button>${current?'<button type="button" id="cancel">キャンセル</button>':''}</div></form></section>`}function events(){return`<section class="panel"><h2>イベント履歴 (${state.events.length})</h2><form id="eventform"><label>記録内容<textarea id="eventtext" required maxlength="4000" placeholder="王命、戦果、外交、重要決定など"></textarea></label><button class="primary">履歴を追加</button></form></section><section class="panel">${state.events.map(e=>`<div class="item"><small>${esc(e.at)}</small><div>${esc(e.text)}</div><div class="actions"><button data-eventdelete="${esc(e.id)}" class="danger">削除</button></div></div>`).join('')||'履歴はありません。'}</section>`}function tools(){return`<section class="panel"><h2>D20判定</h2><label>難易度DC<input id="dc" type="number" value="12"></label><label>補正合計<input id="mod" type="number" value="0"></label><label>判定の説明<input id="rollnote" placeholder="例：交渉判定"></label><button class="primary" id="roll">D20を振る（振り直し不可）</button><div id="rollresult" class="notice" style="margin-top:12px">判定前にDCと補正を確認してください。</div></section><section class="panel"><h2>セーブ管理</h2><p>JSON形式で全台帳・履歴を出力します。別端末へ移す場合もこのファイルを利用してください。</p><div class="actions"><button class="primary" id="export">JSONを書き出す</button><button id="import">JSONを読み込む</button><button id="reset" class="danger">全データ初期化</button></div></section><section class="panel"><h2>現バージョンの範囲</h2><p>v0.1はローカル台帳・時間・収益・研究・建築・ダイス・履歴・バックアップを実装しています。AI GM、戦術図、複雑な戦闘、HP/MP自動回復、国家・兵器の自動数値生成は今後の開発対象です。</p></section>`}function wire(){document.querySelectorAll('[data-advance]').forEach(b=>b.onclick=()=>advance(+b.dataset.advance));$('nextturn')?.addEventListener('click',()=>{state.turn++;log('第'+state.turn+'幕開始');save();render()});$('settings')?.addEventListener('click',()=>{let d=+$('day').value,h=+$('hour').value,m=+$('minute').value;if(!(d>=1&&d<=100&&h>=0&&h<24&&m>=0&&m<60))return alert('日時の範囲を確認してください');Object.assign(state,{world:$('world').value||'新規キャンペーン',playerNation:$('player').value,season:$('season').value,day:d,hour:h,minute:m});log('キャンペーン設定更新');save();render()});$('recordform')?.addEventListener('submit',e=>{e.preventDefault();const k=tab,form=new FormData(e.target),obj={id:edit?.id||uid()};for(const [key,,type]of schemas[k])obj[key]=type==='number'?num(form.get(key)):String(form.get(key)||'').trim();if(!obj.name)return;const i=state[k].findIndex(x=>x.id===obj.id);if(i<0)state[k].push(obj);else state[k][i]=obj;log(`${kinds[k]}「${obj.name}」${i<0?'登録':'更新'}`);edit=null;save();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit={kind:tab,id:b.dataset.edit};render();$('recordform').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const i=state[tab].findIndex(x=>x.id===b.dataset.delete);if(i<0)return;if(confirm('「'+state[tab][i].name+'」を削除しますか？')){log(`${kinds[tab]}「${state[tab][i].name}」削除`);state[tab].splice(i,1);save();render()}});$('cancel')?.addEventListener('click',()=>{edit=null;render()});$('eventform')?.addEventListener('submit',e=>{e.preventDefault();const v=$('eventtext').value.trim();if(v){log(v);save();render()}});document.querySelectorAll('[data-eventdelete]').forEach(b=>b.onclick=()=>{if(confirm('履歴を削除しますか？')){state.events=state.events.filter(e=>e.id!==b.dataset.eventdelete);save();render()}});$('roll')?.addEventListener('click',()=>{const dc=num($('dc').value),mod=num($('mod').value),note=$('rollnote').value.trim(),r=secureDie(20),total=r+mod,ok=r===20?true:r===1?false:total>=dc;const result=`${note||'D20判定'} / DC ${dc} / 補正 ${mod>=0?'+':''}${mod} / 出目 ${r} / 合計 ${total} / ${r===20?'自然20・':r===1?'自然1・':''}${ok?'成功':'失敗'}`;$('rollresult').textContent=result;log(result);save()});$('export')?.addEventListener('click',exportData);$('exportHome')?.addEventListener('click',exportData);$('import')?.addEventListener('click',()=>$('file').click());$('reset')?.addEventListener('click',()=>{if(confirm('全データを初期化します。バックアップ済みですか？')&&confirm('本当にすべて消去しますか？')){state=fresh();save();render()}})}function secureDie(sides){const a=new Uint32Array(1),limit=Math.floor(4294967296/sides)*sides;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%sides+1}function daily(){const key=state.season+':'+state.day;if(state.lastDailyKey===key)return;for(const n of state.nations){let income=num(n.income);for(const b of state.buildings)if(b.nation===n.name&&num(b.daysLeft)<=0)income+=num(b.income);n.treasury=num(n.treasury)+income}for(const r of state.research)if(num(r.target)>num(r.progress))r.progress=Math.min(num(r.target),num(r.progress)+num(r.daily));for(const b of state.buildings)if(num(b.daysLeft)>0)b.daysLeft=Math.max(0,num(b.daysLeft)-1);state.lastDailyKey=key;log('06:00 日次収益・研究・建築工期を計上')}function tickMinute(){state.minute++;if(state.minute>=60){state.minute=0;state.hour++}if(state.hour>=24){state.hour=0;state.day++;if(state.day>100){state.day=1;let s=['春','夏','秋','冬'],i=s.indexOf(state.season);state.season=s[(i+1)%4]}}if(state.hour===6&&state.minute===0)daily()}function advance(hours){if(!Number.isInteger(hours)||hours<1||hours>24)return;for(let i=0;i<hours*60;i++)tickMinute();log(hours+'時間経過');save();render()}function exportData(){const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='VALDIA_save_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('バックアップを作成しました')}$('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('10MBを超えています');const d=JSON.parse(await file.text());if(!d||d.version!==1||!Object.keys(kinds).every(k=>Array.isArray(d[k]))||!['春','夏','秋','冬'].includes(d.season)||!Number.isInteger(d.day)||d.day<1||d.day>100||!Number.isInteger(d.hour)||d.hour<0||d.hour>23||!Number.isInteger(d.minute)||d.minute<0||d.minute>59)throw Error('形式が異なります');if(confirm('現在のデータを読み込んだデータで置き換えますか？')){state=d;save();edit=null;tab='home';render();notify('読み込み完了')}}catch(err){alert('読み込み失敗: '+err.message)}e.target.value=''});render();
</script></body></html>
